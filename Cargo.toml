[workspace]
resolver = "2"
members = ["apps/desktop", "crates/*"]
exclude = ["vendor/gpui", "vendor/xattr", "vendor/proc-macro-error2"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
gpui = { version = "=0.2.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }

[patch.crates-io]
gpui = { path = "vendor/gpui" }
xattr = { path = "vendor/xattr" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

[profile.dev]
debug = 0
[profile.test]
debug = 0
[profile.release]
lto = "thin"
codegen-units = 1
