[workspace]
resolver = "2"
members = ["apps/desktop", "crates/*"]
exclude = ["vendor/gpui", "vendor/xattr", "vendor/proc-macro-error2"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df", features = ["native-file-dialog"] }

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "dd672fc8257a1bfb55d2e8595f585fc411e709df" }

[profile.dev]
debug = 0
# The canvas is rasterized on the CPU; keep its rasterizer fast in debug builds.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.folio-ink]
opt-level = 3
[profile.dev.package.folio-export]
opt-level = 3
[profile.test]
debug = 0
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Optimized like release, linked quickly: for measuring frame times.
[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = false

[profile.release.package.folio-ink]
opt-level = "s"

[profile.release.package.folio-document]
opt-level = "s"

[profile.release.package.folio-canvas]
opt-level = "s"

[profile.release.package.folio-recognition]
opt-level = 3
