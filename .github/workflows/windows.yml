name: Linux and Windows
on:
  push:
    tags-ignore:
      - "archive/**"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check documentation allowlist
        run: python scripts/check-documentation.py

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify updater recovery
        run: python scripts/test_windows_update_worker.py
      - name: Verify compact Windows packaging
        run: python scripts/test_windows_packaging.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Selecting the Rust toolchain failed.' }
      - name: Prepare offline tools
        run: |
          python scripts/package-windows.py --runtime-only --output artifacts/tools
          $package = (Get-ChildItem artifacts/tools -Directory -Filter 'folio-*-windows-x64' | Select-Object -First 1).FullName
          "FOLIO_MATH_CONFIG=$package/math-solver/pack.json" >> $env:GITHUB_ENV
          "$package/pdf/bin" >> $env:GITHUB_PATH
          python scripts/verify-windows-runtime.py --package $package --output artifacts/runtime.json
      - name: Check Rust targets
        run: ./scripts/build-windows.ps1 -Check
      - name: Test Rust workspace
        # Controller tests each start storage/rendering workers of their own.
        run: ./scripts/build-windows.ps1 -Test -TestThreads 2
      - name: Find installer compiler
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (!$compiler) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
            )
            $path = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (!$path) { throw 'The Windows runner is missing its preinstalled Inno Setup compiler.' }
            (Split-Path $path) >> $env:GITHUB_PATH
          }
      - name: Build release and package
        run: |
          ./scripts/build-windows.ps1
          python scripts/package-windows.py --installer --output artifacts/dist
      - name: Save installer, portable package and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-x64
          path: |
            artifacts/dist/*.zip
            artifacts/dist/*-setup.exe
            artifacts/dist/*.sha256
            artifacts/runtime.json

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify updater recovery
        run: python scripts/test_windows_update_worker.py
      - name: Verify compact Windows packaging
        run: python scripts/test_windows_packaging.py
      - name: Install native libraries and offline math
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype-dev libclang-dev libssl-dev poppler-utils
          python -m pip install -r scripts/math-solver-requirements.txt
          python scripts/setup-math-solver.py
          echo "FOLIO_MATH_CONFIG=$PWD/artifacts/math-solver/pack.json" >> "$GITHUB_ENV"
      - name: Verify math worker protocol
        run: python scripts/test_math_worker_protocol.py
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify renderer resize policy
        run: python scripts/test_renderer_resize.py
      - name: Test Rust workspace
        run: cargo test --locked --workspace -- --test-threads=2
